# gitleaks 配置：默认规则 + 测试夹具假凭据的精确放行
[extend]
  useDefault = true

[allowlist]
  description = "测试夹具中的假凭据（非真实密钥，redactor 单测输入）"
  regexes = [
    '''^ghp_0123456789abcdefghijklmnopqrstuvwxyz$''',
  ]

# Exact synthetic values in reviewed security tests. Default rules remain enabled;
# new values in these same files are still scanned.
[[rules]]
  id = "github-pat"
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''edge/agent/evidence_test\.go$''']
    regexes = ['''^ghp_012345678901234567890123456789012345$''']

[[rules]]
  id = "generic-api-key"
  # Exact canaries used to prove that isolated enterprise/native journeys do
  # not leak or execute credential-shaped input. Each value is bound to its
  # reviewed test path; changed values and copied paths remain detectable.
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''^scripts/enterprise-experience/gateway-edge-smoke\.py$''']
    regexes = ['''^synthetic-fixture-key-at-least-32-bytes$''']
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''^connectors/hermes/native_protocol_test\.go$''']
    regexes = ['''^sk-ABCDEFGHIJKLMNOP12$''']
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''^connectors/openclaw/native_contract_test\.go$''']
    regexes = ['''^siqcanary123456$''']
  # The scanner calibration source must name the reviewed values in order to
  # prove their exceptions are exact. Bind those literals to this file only;
  # the calibration below verifies that copied paths and other keys still fail.
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''^scripts/check_gitleaks_config\.py$''']
    regexes = ['''^(?:synthetic-fixture-key-at-least-32-bytes|sk-ABCDEFGHIJKLMNOP12|siqcanary123456|sk-proj-secret1234567890123456)$''']
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''(?:apps/agentshield/internal/(?:receipt/session_(?:capacity|idle)_test|server/server_test)\.go|apps/control-api/app/tests/test_(?:e2e_fresh_deploy|threat_analysis)\.py|connectors/(?:process/process|kubernetes/kubernetes|piagent/piagent|systemd/systemd)_test\.go)$''']
    regexes = ['''^(?:sk-abcdefghijklmnopqrstuvwxyz012345|0123456789abcdef0123456789abcdef0123456789abcdef|sk-proj-secret1234567890123456|ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123|xoxb-1234567890-abcdefghij|sk-test1234567890ab|tok-ultra-secret-67890|sk-piSecretKey123456789|sk-livekey123456789)$''']
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''docs/(?:hackathon/)?evidence/[^\n]+\.json$''']
    regexTarget = "line"
    regexes = ['''^\s*"(?:[^"\r\n]+/)?[^"/\r\n]+\.(?:go|py|json|toml|js|ts|tsx|mjs|cjs|md|sh|ps1|yml|yaml|css|html|log)": "[a-f0-9]{64}",?\s*$''']
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''docs/hackathon/evidence/benchmark-20260908/controls-first\.json$''']
    regexes = ['''^M0TfIyTYjfzpAaFbrhRVPm1PTlMPQ2Eei/kcYna\+y7w=$''']
  # Reviewed SHA-256 of an isolated native session routing identifier, verified
  # against the frozen generator and six original evidence records. Only this
  # exact value, field line and evidence path are excepted; new values still scan.
  [[rules.allowlists]]
    condition = "AND"
    paths = ['''^docs/evidence/personal-experience/windows-sunbo/openclaw-session-epoch-20260918/summary\.json$''']
    regexTarget = "line"
    regexes = ['''^\s*"session_key_sha256": "b4f6a7cf296ab0fd7f3dc39c1fe6b0520d93d21b740a61692ba991a9bf28ad47",?\s*$''']

