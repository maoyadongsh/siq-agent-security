# Enterprise static entry (HTTP listen). DEV17-B / M-P5e.
# No HSTS here — HSTS belongs only on HTTPS terminators, not local Compose HTTP.
# Each location re-includes security headers because nginx drops parent add_header
# when a child location sets any add_header.

# Failed assets must not poison caches for a year. 304 retains the same asset
# policy; HTML remains revalidated through the separate location below.
map $status $siq_asset_cache {
  default "no-store";
  200 "public, max-age=31536000, immutable";
  206 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/security-headers.inc;

  location = /health {
    include /etc/nginx/conf.d/security-headers.inc;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control $siq_asset_cache always;
  }
}
