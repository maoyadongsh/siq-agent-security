[project]
name = "siq-agent-security-control-api"
version = "0.1.0"
description = "SIQ Agent Security Control Plane API（模块化单体）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "cryptography>=50.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.security.require_permission"]

[tool.ruff.lint.per-file-ignores]
"app/tests/conftest.py" = ["E402"]
"migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q"
