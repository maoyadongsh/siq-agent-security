name: personal-experience

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-workbuddy-components:
    name: Windows WorkBuddy components and baseline comparison
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache: false
      - name: Validate comparison failure handling
        run: python -m unittest discover -s scripts/personal-experience/tests -p test_windows_go_compare.py -v
      - name: Prepare a private local NTFS fixture root
        run: |
          Get-Volume | Select-Object DriveLetter, FileSystem, DriveType | Format-Table
          $drive = $env:SystemDrive.TrimEnd(':')
          if ((Get-Volume -DriveLetter $drive).FileSystem -ne 'NTFS') { throw 'NTFS fixture volume required' }
          $fixtureRoot = Join-Path ($env:SystemDrive + '\') ('siq-wb-ci-' + [guid]::NewGuid().ToString('N'))
          $directory = New-Item -ItemType Directory -Path $fixtureRoot -ErrorAction Stop
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = [System.Security.AccessControl.DirectorySecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          $acl.SetOwner($sid)
          foreach ($principal in @($sid.Value, 'S-1-5-18', 'S-1-5-32-544')) {
            $identity = [System.Security.Principal.SecurityIdentifier]::new($principal)
            $rule = [System.Security.AccessControl.FileSystemAccessRule]::new($identity, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $acl.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $directory.FullName -AclObject $acl
          "SIQ_WINDOWS_CI_TEMP=$fixtureRoot" >> $env:GITHUB_ENV
      - name: Windows ACL, uninstall readback, profile and concurrent hooks
        working-directory: apps/agentshield
        # Isolated test state only; no desktop, model, real Grant or system task.
        run: |
          python ../../scripts/personal-experience/windows_ci_owner.py go test -count=1 -timeout 10m -v ./internal/adapterinstall ./internal/privatefs ./internal/state ./cmd/agentshield ./internal/runtimepath ./internal/effectevidence ./internal/server -run 'TestWorkBuddyUninstallReadbackPreservesHostSettings|TestWorkBuddyManagedInstallDiagnosisAndRevokedUninstall|TestWorkBuddyManagedPreflight|TestWorkBuddyManagedApplyRechecksACL|TestManagedConfigReplacementAndRollbackPreserveDeny|TestManagedFileNewPublicationAndDeletedFileRestore|TestWorkBuddyManagedConcurrent|TestFreshWindowsClientInitialization|TestWindowsInitialization|TestWindowsPrivate|TestWindowsReadSnapshot|TestSecurity|TestWindowsMigrationDistinguishes|TestWindowsLiveResource|TestWindowsResource|TestWindowsPending|TestWorkBuddyWindowsFileEvidence' > "$env:RUNNER_TEMP/wb-targeted.txt" 2>&1
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/wb-targeted.txt"
          exit $code
      - name: Preserve targeted failure immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-workbuddy-targeted-${{ github.sha }}
          path: ${{ runner.temp }}/wb-targeted.txt
          if-no-files-found: error
      - name: Full module comparison with exact base (not desktop acceptance)
        if: always()
        run: |
          if (-not $env:BASE_SHA -or $env:BASE_SHA -eq ('0' * 40)) {
            $env:BASE_SHA = git rev-parse HEAD^
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/personal-experience/windows_ci_owner.py python scripts/personal-experience/windows_go_compare.py --require-full-pass --base $env:BASE_SHA --out "$env:RUNNER_TEMP/wb-review"
          exit $LASTEXITCODE
      - name: Preserve component results and both full runs, never private state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-workbuddy-components-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/wb-targeted.txt
            ${{ runner.temp }}/wb-review/candidate.jsonl
            ${{ runner.temp }}/wb-review/candidate.stderr.txt
            ${{ runner.temp }}/wb-review/candidate.exit.txt
            ${{ runner.temp }}/wb-review/baseline.jsonl
            ${{ runner.temp }}/wb-review/baseline.stderr.txt
            ${{ runner.temp }}/wb-review/baseline.exit.txt
            ${{ runner.temp }}/wb-review/comparison.json
  macos-path-config-regressions:
    name: macOS path and config regressions (component only)
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.6"
          cache: false
      - name: Real Darwin aliases and isolated adapter configuration round trips
        working-directory: apps/agentshield
        # No launchctl, live agent, credentials or model calls. This is not
        # OpenClaw/Hermes/WorkBuddy native application acceptance.
        run: go test ./internal/stateformat ./internal/adapterinstall -run 'Test(Darwin|NonDarwin|CheckParents|OpenClaw)' -count=1 -v
  windows-build-inputs:
    name: Windows build inputs (not native Agent acceptance)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Locked frontend dependencies
        working-directory: apps/web
        run: npm.cmd ci
      - name: Frontend tests and both Windows shell build entries
        working-directory: apps/web
        run: |
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build:local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run dev:local -- --help
          exit $LASTEXITCODE
      - name: Locked contract validation dependencies
        working-directory: apps/control-api
        run: uv sync --dev --locked
      - name: Byte-exact contract samples without the Linux API fixture
        working-directory: apps/control-api
        # These tests need no API fixtures. The global conftest imports the
        # Linux-only fcntl service; this job does not claim Windows API support.
        run: uv run pytest --noconftest app/tests/test_schema_contracts.py
  evidence-tool:
    name: evidence-tool (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Verifier unit tests only, not native Agent acceptance
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/personal-experience/tests -p test_platform_acceptance.py -v
      - name: N09 evidence integrity and completion guards (offline)
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/personal-experience -p test_n09_evidence.py -v
  evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install existing locked validation dependencies
        working-directory: apps/control-api
        run: uv sync --dev --locked
      - name: Schema, producer and lint
        run: |
          apps/control-api/.venv/bin/ruff check scripts/personal-experience/platform_acceptance.py scripts/personal-experience/tests
          apps/control-api/.venv/bin/python -m unittest discover -s scripts/personal-experience/tests -v
      - name: Untested inventory must remain incomplete
        run: |
          mkdir -p .tmp/platform-acceptance-empty
          python3 scripts/personal-experience/platform_acceptance.py init --candidate "$GITHUB_SHA" --out .tmp/platform-acceptance-empty/matrix.json
          result=0
          python3 scripts/personal-experience/platform_acceptance.py verify .tmp/platform-acceptance-empty/matrix.json --evidence-root .tmp/platform-acceptance-empty --candidate "$GITHUB_SHA" --require-native --out .tmp/platform-acceptance-empty/report.json || result=$?
          test "$result" = 3
