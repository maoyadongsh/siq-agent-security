name: personal-experience

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-path-config-regressions:
    name: macOS path and config regressions (component only)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22"
          cache: false
      - name: Real Darwin aliases and isolated adapter configuration round trips
        working-directory: apps/agentshield
        # No launchctl, live agent, credentials or model calls. This is not
        # OpenClaw/Hermes/WorkBuddy native application acceptance.
        run: go test ./internal/stateformat ./internal/adapterinstall -run 'Test(Darwin|NonDarwin|CheckParents|OpenClaw)' -count=1 -v
  windows-build-inputs:
    name: Windows build inputs (not native Agent acceptance)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Locked frontend dependencies
        working-directory: apps/web
        run: npm.cmd ci
      - name: Frontend tests and both Windows shell build entries
        working-directory: apps/web
        run: |
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build:local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run dev:local -- --help
          exit $LASTEXITCODE
      - name: Locked contract validation dependencies
        working-directory: apps/control-api
        run: uv sync --dev --locked
      - name: Byte-exact contract samples without the Linux API fixture
        working-directory: apps/control-api
        # These tests need no API fixtures. The global conftest imports the
        # Linux-only fcntl service; this job does not claim Windows API support.
        run: uv run pytest --noconftest app/tests/test_schema_contracts.py
  evidence-tool:
    name: evidence-tool (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Verifier unit tests only, not native Agent acceptance
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/personal-experience/tests -p test_platform_acceptance.py -v
      - name: N09 evidence integrity and completion guards (offline)
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/personal-experience -p test_n09_evidence.py -v
  evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install existing locked validation dependencies
        working-directory: apps/control-api
        run: uv sync --dev --locked
      - name: Schema, producer and lint
        run: |
          apps/control-api/.venv/bin/ruff check scripts/personal-experience/platform_acceptance.py scripts/personal-experience/tests
          apps/control-api/.venv/bin/python -m unittest discover -s scripts/personal-experience/tests -v
      - name: Untested inventory must remain incomplete
        run: |
          mkdir -p .tmp/platform-acceptance-empty
          python3 scripts/personal-experience/platform_acceptance.py init --candidate "$GITHUB_SHA" --out .tmp/platform-acceptance-empty/matrix.json
          result=0
          python3 scripts/personal-experience/platform_acceptance.py verify .tmp/platform-acceptance-empty/matrix.json --evidence-root .tmp/platform-acceptance-empty --candidate "$GITHUB_SHA" --require-native --out .tmp/platform-acceptance-empty/report.json || result=$?
          test "$result" = 3
