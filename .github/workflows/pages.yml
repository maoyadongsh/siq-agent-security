name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/agentshield/**'
      - 'adapters/runtime/**'
      - 'README*'
      - 'REPRODUCIBILITY.md'
      - 'docs/research/**'
      - 'scripts/check_site.py'
      - 'scripts/check_pages_action_pins.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'apps/agentshield/**'
      - 'adapters/runtime/**'
      - 'README*'
      - 'REPRODUCIBILITY.md'
      - 'docs/research/**'
      - 'scripts/check_site.py'
      - 'scripts/check_pages_action_pins.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate source diagrams and validate site
        run: |
          python3 site/diagrams/from_code.py
          python3 scripts/check_site.py
          python3 scripts/check_site_mermaid_vendor.py
          python3 scripts/check_pages_action_pins.py
      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.repository == 'maoyadongsh/siq-agent-security' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
