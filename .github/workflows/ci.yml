name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action 在 pull_request 上会 GET /pulls/{n}/commits；
    # 顶层 contents:read 会把其余权限置 none，缺了这一项即 403。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject tracked task-signing private keys
        run: |
          bad=0
          while IFS= read -r path; do
            case "$path" in
              *signing-key*.seed)
                echo "tracked private-key artifact: $path"
                bad=1
                ;;
            esac
          done < <(git ls-files)
          test "$bad" -eq 0
      # 当前树已无该文件（145e53f 起），但 blob 仍留在 origin/main 历史里。
      # `--all` 会让每条 PR 都失败；这里只拦本变更相对 base 新加入的路径。
      # 要从已发布历史里清掉旧 blob，需要单独的 filter-repo，不在功能 PR 里做。
      - name: Reject task-signing private keys added since base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base sha; tracked-file check above is authoritative"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA"
          if git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD \
            | grep -E '(^|/)signing-key[^/]*\.seed$'; then
            echo "task-signing private-key artifact added in this change"
            exit 1
          fi
      - name: Event envelope core checksum
        run: python3 scripts/check_event_envelope_core.py

  control-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: siq_as
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siq_as"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --dev --locked
      - name: Ruff
        run: uv run ruff check app
      - name: Pytest（含租户隔离/职责分离/注册生命周期负向）
        run: uv run pytest
      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit
      - name: Alembic 全量回放（干净 PostgreSQL）
        env:
          SIQ_AS_DEV: "1"
          SIQ_AS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/siq_as
        run: uv run alembic upgrade head

  edge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 双版本保险：1.22 = AGENTS.md 最低支持版本；stable = 最新稳定版
        go-version: ["1.22", "stable"]
        # 全模块覆盖：edge/agent + 现有全部 connector（含 go.mod 独立模块）
        module:
          - edge/agent
          - connectors/hermes
          - connectors/openclaw
          - connectors/docker
          - connectors/directory
          - connectors/systemd
          - connectors/kubernetes
          - connectors/process
          - connectors/mcp
          - connectors/piagent
          - connectors/workbuddy
          - connectors/dify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Go formatting（edge 与 connectors 全部目录）
        run: |
          gofmt -l edge connectors > /tmp/gofmt.out
          test ! -s /tmp/gofmt.out || { cat /tmp/gofmt.out; exit 1; }
      - name: Build & vet & test（${{ matrix.module }} @ go ${{ matrix.go-version }}）
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Production dependency audit
        run: |
          set +e
          output=$(npm audit --omit=dev --audit-level=moderate 2>&1)
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # npm v1/security/audits/quick 正在退役，常返回 400/503，
          # 与依赖漏洞不是同一类失败。
          if printf '%s\n' "$output" | grep -Eqi 'audit endpoint returned an error|This endpoint is being retired|Service Unavailable|Bad Request'; then
            echo "::warning::npm audit registry unavailable; skipping (not a package vulnerability finding)"
            exit 0
          fi
          exit "$code"

  agentshield:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agentshield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"
      - name: vet & test
        run: |
          go vet ./...
          go test ./...
      - name: Cross-compile
        run: |
          set -e
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${t%/*}
            arch=${t#*/}
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /tmp/agentshield-$os-$arch ./cmd/agentshield
          done
