name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gitleaks-action 在 pull_request 上会 GET /pulls/{n}/commits；
    # 顶层 contents:read 会把其余权限置 none，缺了这一项即 403。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject tracked task-signing private keys
        run: |
          bad=0
          while IFS= read -r path; do
            case "$path" in
              *signing-key*.seed)
                echo "tracked private-key artifact: $path"
                bad=1
                ;;
            esac
          done < <(git ls-files)
          test "$bad" -eq 0
      # 当前树已无该文件（145e53f 起），但 blob 仍留在 origin/main 历史里。
      # `--all` 会让每条 PR 都失败；这里只拦本变更相对 base 新加入的路径。
      # 要从已发布历史里清掉旧 blob，需要单独的 filter-repo，不在功能 PR 里做。
      - name: Reject task-signing private keys added since base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base sha; tracked-file check above is authoritative"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA"
          if git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD \
            | grep -E '(^|/)signing-key[^/]*\.seed$'; then
            echo "task-signing private-key artifact added in this change"
            exit 1
          fi
      - name: Event envelope core checksum
        run: python3 scripts/check_event_envelope_core.py
      - name: Control API Dockerfile uses uv.lock (DEV17-A)
        run: python3 scripts/check_control_api_dockerfile_lock.py
      - name: Web nginx security headers (DEV17-B)
        run: python3 scripts/check_web_nginx_headers.py
      - name: CI Actions pinned to commit SHA (DEV17-B)
        run: python3 scripts/check_ci_action_pins.py
      - name: OpenShell workflow download contract (DEV17-C)
        run: python3 scripts/check_openshell_compat_workflow.py
      - name: Site Mermaid self-host pin (DEV17-C)
        run: python3 scripts/check_site_mermaid_vendor.py
      - name: Pages workflow Action pins (DEV17-D)
        run: python3 scripts/check_pages_action_pins.py
      - name: Dockerfile base image digests (DEV17-D)
        run: python3 scripts/check_dockerfile_digests.py
      - name: Local product threats in threat-model (DEV18-B)
        run: python3 scripts/check_threat_model_local.py
      - name: Capability matrix + runbook honesty (DEV18-C)
        run: python3 scripts/check_capability_honesty.py
      - name: Perf baseline harness honesty + smoke (DEV16-D)
        run: python3 scripts/check_perf_baseline_harness.py

  control-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: siq_as
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siq_as"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/control-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - name: Install
        run: uv sync --dev --locked
      - name: Ruff
        run: uv run ruff check app
      - name: Pytest（含租户隔离/职责分离/注册生命周期负向）
        run: uv run pytest
      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit
      - name: Alembic 全量回放（干净 PostgreSQL）
        env:
          SIQ_AS_DEV: "1"
          SIQ_AS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/siq_as
        run: uv run alembic upgrade head

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 双版本保险：1.22 = AGENTS.md 最低支持版本；stable = 最新稳定版
        go-version: ["1.22", "stable"]
        # 全模块覆盖：edge/agent + 现有全部 connector（含 go.mod 独立模块）
        module:
          - edge/agent
          - connectors/hermes
          - connectors/openclaw
          - connectors/docker
          - connectors/directory
          - connectors/systemd
          - connectors/kubernetes
          - connectors/process
          - connectors/mcp
          - connectors/piagent
          - connectors/workbuddy
          - connectors/dify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Go formatting（edge 与 connectors 全部目录）
        run: |
          gofmt -l edge connectors > /tmp/gofmt.out
          test ! -s /tmp/gofmt.out || { cat /tmp/gofmt.out; exit 1; }
      - name: Build & vet & test（${{ matrix.module }} @ go ${{ matrix.go-version }}）
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Production dependency audit
        run: |
          set +e
          output=$(npm audit --omit=dev --audit-level=moderate 2>&1)
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # DEV17-A: registry/tool failure must not soft-pass as clean.
          if printf '%s\n' "$output" | grep -Eqi 'audit endpoint returned an error|This endpoint is being retired|Service Unavailable|Bad Request'; then
            echo "::error::npm audit registry unavailable — marking job failed (not a vulnerability clean bill)"
            exit 1
          fi
          exit "$code"

  agentshield:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agentshield
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"
      - name: vet & test
        run: |
          go vet ./...
          go test ./...
      - name: govulncheck (DEV17-A)
        run: |
          set -e
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          set +e
          govulncheck ./... | tee /tmp/govulncheck.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "govulncheck: no known reachable vulnerabilities"
            exit 0
          fi
          # Non-zero with findings means the scanner ran — not a soft-skip, not CVE-clear.
          if [ "$code" -eq 3 ] || grep -q 'Vulnerability #' /tmp/govulncheck.txt; then
            echo "::warning::govulncheck reported findings (see log). Scan executed; not claiming CVE-clear."
            exit 0
          fi
          echo "::error::govulncheck failed to run (exit $code) — gate must not pass"
          exit 1
      - name: Cross-compile
        run: |
          set -e
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${t%/*}
            arch=${t#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=0.2.0" -o /tmp/siq-agent-security-$os-$arch$ext ./cmd/agentshield
          done
      - name: Verify signed skill-manifest.json
        run: |
          go run ./cmd/agentshield manifest-verify ../../skills/siq-agent-security/skill-manifest.json
      - name: Self-scan Skill pack
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=0.2.0" -o /tmp/siq-agent-security ./cmd/agentshield
          SIQ_AGENT_SECURITY_STATE_DIR=$(mktemp -d) /tmp/siq-agent-security admit ../../skills/siq-agent-security > /tmp/admit.json
          python3 -c 'import json,sys; d=json.load(open("/tmp/admit.json")); v=d.get("verdict"); print(v); sys.exit(0 if v=="admit_with_conditions" else 1)'
